name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      claude-eval:
        description: "Also run the answer evaluation against Claude (uses the ANTHROPIC_API_KEY secret; costs API credits)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Unit tests, the retrieval and answer-quality gates, and the Postgres + pgvector integration
      # test (Testcontainers; the runner has Docker).
      - run: mvn -B -ntp verify
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: target/eval/
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bfsi-rag-assistant:ci .

  claude-eval:
    name: Answer evaluation with Claude
    if: github.event_name == 'workflow_dispatch' && inputs.claude-eval
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp test -Dtest=ClaudeAnswerEvalTest -Deval.claude=true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-eval-report
          path: target/eval/
          if-no-files-found: ignore
