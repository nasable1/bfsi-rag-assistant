# The assistant with Postgres + pgvector: documents, embeddings and the audit trail persist in the
# "pgdata" volume. Copy .env.example to .env and set the keys first, then: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      RAG_DB_URL: jdbc:postgresql://db:5432/rag
      RAG_DB_USER: rag
      RAG_DB_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      RAG_ADMIN_KEY: ${RAG_ADMIN_KEY:?set RAG_ADMIN_KEY in .env (16+ characters)}
      RAG_USER_KEY: ${RAG_USER_KEY:?set RAG_USER_KEY in .env (16+ characters)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
